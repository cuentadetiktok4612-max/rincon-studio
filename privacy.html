<h1>Política de privacidad</h1>
<p>Rincon Studio es una herramienta personal que genera vídeos cortos y los sube al canal de YouTube de su propietario. No recopila, almacena ni comparte datos personales de otras personas. El acceso a YouTube se usa solo para subir vídeos al canal del propietario.</p>
